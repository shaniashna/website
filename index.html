<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consulting Agency</title>
    <link rel="stylesheet" href="style.css">
    
    <!-- Fonts: Inter for a clean, modern look -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <!-- Navigation -->
    <header class="header">
        <div class="container header-container">
            <div class="logo" id="nav-logo"></div>
            <nav class="nav">
                <ul class="nav-list">
                    <li><a href="#services">Services</a></li>
                    <li><a href="#testimonials">Testimonials</a></li>
                    <li><a href="#use-cases">Use Cases</a></li>
                    <li><a href="#contact" class="btn btn-sm">Contact</a></li>
                </ul>
            </nav>
            <!-- Mobile Menu Button -->
            <button class="menu-btn" aria-label="Toggle menu">☰</button>
        </div>
    </header>

    <!-- Hero Section -->
    <section class="hero">
        <div class="container hero-content">
            <h1 id="hero-title"></h1>
            <p id="hero-tagline"></p>
            <p id="hero-description"></p>
            <a href="#contact" class="btn btn-primary">Get in Touch</a>
        </div>
    </section>

    <!-- Services Section -->
    <section id="services" class="section">
        <div class="container">
            <h2 class="section-title">Our Services</h2>
            <div class="grid" id="services-grid">
                <!-- Injected via JS -->
            </div>
        </div>
    </section>

    <!-- Use Cases Section -->
    <section id="use-cases" class="section section-alt">
        <div class="container">
            <h2 class="section-title">Use Cases</h2>
            <div class="grid" id="use-cases-grid">
                <!-- Injected via JS -->
            </div>
        </div>
    </section>

    <!-- Testimonials Section -->
    <section id="testimonials" class="section">
        <div class="container">
            <h2 class="section-title">Client Stories</h2>
            <div class="testimonials-container" id="testimonials-container">
                <!-- Injected via JS -->
            </div>
        </div>
    </section>

    <!-- Contact Section -->
    <section id="contact" class="section section-dark">
        <div class="container contact-container">
            <h2 class="section-title text-light">Contact Us</h2>
            <p class="text-light-muted">Ready to start your project? Reach out to us.</p>
            
            <div class="contact-links" id="contact-info">
                <!-- Injected via JS -->
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <p>&copy; <span id="year"></span> <span id="footer-business-name"></span>. All rights reserved.</p>
        </div>
    </footer>

    <!-- Scripts -->
    <!-- Load config first so it's available to script.js -->
    <script src="config.js"></script>
    <script src="script.js"></script>
</body>
</html>
